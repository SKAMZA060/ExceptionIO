name: CI Build & Lighthouse

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run build (images, minify CSS/JS, prepare dist)
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_NOTIFICATION_TEMPLATE: ${{ secrets.EMAILJS_NOTIFICATION_TEMPLATE }}
        run: npm run ci-build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Archive minified assets
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            Styles/*.min.css
            Scripts/*.min.js

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Serve dist
        run: npx http-server dist -p 8080 & sleep 2

      - name: Run LHCI (Lighthouse CI)
        run: npx -y @lhci/cli autorun --upload.target=temporary-public-storage --url=http://127.0.0.1:8080

      - name: Upload lighthouse report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci
